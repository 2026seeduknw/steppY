<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>학점 인정 — steppY</title>
<link rel="icon" href="assets/logo-mark-circle.png" type="image/png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/credits.css">
<link rel="stylesheet" href="css/pages/major-matching.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-page="credits">

<div id="app-nav" class="app-nav"></div>

<div class="page-shell home-hero">
  <h1 id="creditsPageTitle">학점 인정 사전 확인</h1>
</div>

<div class="page-shell credits-grid">
  <main>
    <div class="mode-toggle" id="modeToggle">
      <button type="button" class="mode-toggle__btn" data-mode="major">전공 매칭 찾기</button>
      <button type="button" class="mode-toggle__btn is-active" data-mode="course">학점 인정 과목 찾기</button>
    </div>
    <div class="credits-lede" id="creditsLede">
      <strong>과목 위계·키워드로 보는 학점 인정 가능성</strong>
      <p>파견교 과목의 수준(Level)과 전공 키워드를 분석해 인정 가능성을 예측하고, 그 판단 근거를 함께 보여드려요.</p>
    </div>
    <div class="match-query" id="matchQuery">
      <div class="match-query__row">
        <span class="match-query__label">소속 학과</span>
        <div id="majorFilterMount" class="major-filter-mount"></div>
      </div>
      <div class="match-query__row" id="schoolFilterRow">
        <span class="match-query__label">파견 희망교</span>
        <div id="schoolFilterMount" class="major-filter-mount"></div>
      </div>
      <button type="button" class="btn btn--accent match-query__cta" id="runMatchBtn">전공 과목 매칭 조회하기</button>
    </div>
    <div id="relevanceFilterMount"></div>
    <div id="countryFilterMount"></div>
    <p id="confirmedSchoolNote" class="major-match-confirmed-note" hidden></p>
    <div id="matchList"></div>
  </main>
</div>

<div id="mentor-float"></div>

<script src="js/release-flags.js"></script>
<script src="js/analytics.js"></script>
<script src="js/review-topics.js"></script>
<script src="js/currency-rates.js"></script>
<script src="js/country-flags.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/school-logos.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data-source.js"></script>
<script src="js/state.js"></script>
<script src="js/decimal-input.js"></script>
<script src="js/components/departure.js"></script>
<script src="js/components/layout.js"></script>
<script src="js/ads.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/components/paywall.js"></script>
<script src="js/components/searchable-select.js"></script>
<script src="js/components/eligibility.js"></script>
<script src="js/components/radar-chart.js"></script>
<script src="js/wordmark-text.js"></script>
<script src="js/components/school-modal.js"></script>
<script src="js/components/profile-card.js"></script>
<script src="js/components/progress-ring.js"></script>
<script src="js/components/todo-card.js"></script>
<script src="js/components/prepare-view.js"></script>
<script src="js/components/target-major.js"></script>
<script src="js/credits.js"></script>
<script src="js/app-links.js"></script>
<script src="js/invite.js"></script>
</body>
</html>
