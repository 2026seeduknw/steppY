<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학점 인정 — steppY</title>
<link rel="icon" href="assets/logo-mark-circle.png" type="image/png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">

<body data-page="credits">

<div id="app-nav" class="app-nav"></div>

<div class="page-shell home-hero">
  <h1 id="creditsPageTitle">학점 인정 사전 확인</h1>
  <p id="creditsPageSubtitle" hidden></p>
</div>

<div class="page-shell credits-grid">
  <main>
    <div class="mode-toggle" id="modeToggle">
      <button type="button" class="mode-toggle__btn is-active" data-mode="course">학점인정 과목 찾기</button>
      <button type="button" class="mode-toggle__btn" data-mode="major">전공 매칭 찾기</button>
    </div>
    <div class="section-title">
      <div></div>
      <div class="section-title__actions">
        <div id="majorFilterMount" class="major-filter-mount"></div>
        <button class="btn btn--ghost btn--sm" id="downloadReportBtn">리포트 출력/다운로드</button>
      </div>
    </div>
    <p id="confirmedSchoolNote" class="major-match-confirmed-note" hidden></p>
    <div id="matchList"></div>
  </main>
</div>

<div id="mentor-float"></div>

<script src="js/analytics.js"></script>
<script src="js/review-topics.js"></script>

<script src="js/components/eligibility.js"></script>
<script src="js/components/radar-chart.js"></script>
<script src="js/components/school-modal.js"></script>
<script src="js/components/profile-card.js"></script>
<script src="js/components/progress-ring.js"></script>
<script src="js/components/todo-card.js"></script>
<script src="js/components/prepare-view.js"></script>
<script src="js/credits.js"></script>
