<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>steppY — 서비스 준비 중</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: radial-gradient(120% 140% at 50% -10%, #23354D 0%, #02122F 55%, #02122F 100%);
    color: #F0ECDD;
  }

  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
  }

  .badge {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #F0ECDD;
    color: #02122F;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.5rem;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
    box-shadow: 0 10px 28px rgba(2, 18, 47, 0.45);
  }

  h1 {
    font-weight: 800;
    font-size: clamp(1.75rem, 4vw, 2.5rem);
    letter-spacing: -0.01em;
    margin: 0 0 16px;
  }

  p.desc {
    font-size: 0.9375rem;
    line-height: 1.7;
    color: #8BA3C5;
    max-width: 440px;
    margin: 0 0 32px;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    height: 52px;
    padding: 0 32px;
    border-radius: 999px;
    background: #F0ECDD;
    color: #23354D;
    font-weight: 700;
    font-size: 0.9375rem;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: transform 260ms cubic-bezier(0.16, 1, 0.3, 1), opacity 260ms;
  }
  .cta:hover { transform: translateY(-2px); }
  .cta:active { transform: translateY(0); }

  .toast {
    margin-top: 20px;
    padding: 12px 20px;
    border-radius: 12px;
    background: rgba(225, 93, 70, 0.14);
    color: #E15D46;
    font-weight: 700;
    font-size: 0.9375rem;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 220ms ease, transform 220ms ease;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  footer {
    margin-top: 48px;
    font-size: 0.8125rem;
    color: #495B7D;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<main class="wrap">
  <div class="badge">S</div>
  <h1>서비스 준비 중입니다</h1>
  <p class="desc">더 나은 모습으로 다시 찾아뵙기 위해 잠시 점검하고 있어요.<br>조금만 기다려 주세요!</p>

  <button type="button" class="cta" id="enterBtn">서비스 살펴보기</button>
  <div class="toast" id="toast" role="status" aria-live="polite">서비스 수리중입니다!</div>

  <footer>steppY</footer>
</main>

<script>
  var btn = document.getElementById('enterBtn');
  var toast = document.getElementById('toast');
  var hideTimer = null;

  btn.addEventListener('click', function () {
    toast.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      toast.classList.remove('show');
    }, 2600);
  });
</script>

</body>
</html>
