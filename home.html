<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>홈 · steppY</title>
<link rel="icon" href="assets/logo-mark-circle.png" type="image/png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/home.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/v2.css">
</head>
<body data-page="home">

<div id="app-nav" class="app-nav"></div>

<div class="page-shell v2-home">
  <header class="v2-home__head">
    <h1 class="v2-wordmark" aria-label="steppY">STEPPY</h1>
    <p class="v2-home__greet" id="greeting"></p>
    <a class="profile-cta" id="profileCta" href="onboarding.html" hidden>기본 정보를 입력해 주세요</a>
  </header>

  <!-- 진행 단계 — 화면 폭 전체의 얇은 띠. 발자국 길이 길어야 걸어가는 느낌이 산다 -->
  <section class="v2-widget v2-widget--stage" aria-label="진행 단계">
    <div id="journeySteps"></div>
  </section>

  <!-- 바로가기 — 그 아래 색 카드 세 장을 한 줄에(넘기지 않음) -->
  <section class="v2-shortcuts" aria-label="바로가기">
    <div class="v2-shortcuts__track" id="shortcutTrack">
      <a class="v2-shortcut v2-shortcut--sand" href="credits.html?mode=major">
        <strong class="v2-shortcut__title">전공 매칭</strong>
        <span class="v2-shortcut__sub">내 전공과 가까운<br>파견교 학과 찾기</span>
        <span class="v2-shortcut__go" aria-hidden="true">→</span>
      </a>
      <a class="v2-shortcut v2-shortcut--mint" href="consult.html">
        <strong class="v2-shortcut__title">Mentor's Step</strong>
        <span class="v2-shortcut__sub">다녀온 선배에게<br>물어보기</span>
        <span class="v2-shortcut__go" aria-hidden="true">→</span>
      </a>
      <a class="v2-shortcut v2-shortcut--sky" href="credits.html">
        <strong class="v2-shortcut__title">과목 찾기</strong>
        <span class="v2-shortcut__sub">파견교 과목<br>학점 인정 확인</span>
        <span class="v2-shortcut__go" aria-hidden="true">→</span>
      </a>
    </div>
  </section>

  <!-- 다가오는 국제처 일정 두 줄 —
       js/components/oia-timeline.js renderUpcomingSchedule -->
  <section class="upcoming" id="homeSchedule" aria-label="다가오는 국제처 일정" hidden></section>

  <!-- 할 일 — 두 상자 아래 가로로 긴 알약. 누르면 아래로 목록이 펼쳐진다 -->
  <section class="v2-todo" id="todoCard" aria-label="할 일"></section>

  <section class="v2-picks" aria-label="지망 학교">
    <p class="v2-picks__label">MY PICKS</p>
    <!-- 같은 줄 오른쪽 끝 — 내 저장(PICKS) 탭으로 가서 지망·찜한 학교를 나란히 비교 -->
    <a class="v2-picks__go" href="saved.html" aria-label="지망 학교 비교하러 가기">비교 →</a>
    <div class="v2-wheel" id="picksWheel"></div>
  </section>

  <button type="button" class="search-cta" id="partnerPromoBanner" data-release="partnerPromo" style="border:none;width:100%;text-align:left;cursor:pointer;font:inherit;">
    <div>
      <h2>보험·어학원·여행까지, 제휴 혜택으로 준비해보세요</h2>
      <p>교환학생 전용 해외보험·어학연수·여행 프로그램을 특별 혜택가로 준비할 수 있어요</p>
    </div>
    <span class="btn btn--accent">제휴 혜택 보기</span>
  </button>
</div>

<div id="mentor-float"></div>

<script src="js/release-flags.js"></script>

<script src="js/decimal-input.js"></script>
<script src="js/components/departure.js"></script>
<script src="js/components/layout.js"></script>
<script src="js/components/dropdown.js"></script>
<script src="js/ads.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/components/paywall.js"></script>

<script src="js/components/profile-card.js"></script>
<script src="js/components/todo-card.js"></script>
<script src="js/components/target-major.js"></script>
<script src="js/components/oia-timeline.js"></script>
<script src="js/components/prepare-view.js"></script>
<script src="js/components/logo-fit.js"></script>
<script src="js/home.js"></script>
<script src="js/app-links.js"></script>
<script src="js/invite.js"></script>
</body>
</html>
