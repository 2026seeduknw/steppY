<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>학교 찾기 — steppY</title>
<link rel="icon" href="assets/logo-mark-circle.png" type="image/png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/search.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-page="search">

<div id="app-nav" class="app-nav"></div>

<div class="page-shell">
  <div class="search-toolbar">
    <input type="search" class="search-input" id="searchInput" placeholder="학교명 · 국가명으로 검색">
    <button type="button" class="quick-filter quick-filter--more" id="quickMore">➕ 상세 필터</button>
    <!-- 가장 자주 거르는 세 가지(어디·얼마·날씨)는 시트를 열지 않고 여기서 바로 고른다.
         나머지(학과·자격·언어·상권·치안·QS·정렬)는 '상세 필터' 시트에 있다. -->
    <div class="quick-filters" role="group" aria-label="빠른 필터">
      <select class="quick-filter" id="quickRegion" aria-label="대륙/국가"></select>
      <select class="quick-filter" id="quickCost" aria-label="한 달 물가">
        <option value="">💰 한 달 물가</option>
        <option value="low">250만 원 이하</option>
        <option value="mid">250만~350만 원</option>
        <option value="high">350만 원 이상</option>
      </select>
      <select class="quick-filter" id="quickClimate" aria-label="기후/날씨"></select>
    </div>
  </div>

  <!-- 로그인 상태에서는 학점 인정으로 보내고, 게스트에게는 js/search.js가
       이 자리를 점수 입력 패널로 바꾼다(renderGuestScorePanel). -->
  <div class="sim-banner sim-banner--cta">
    <a class="credits-cta" href="credits.html">
      <div class="credits-cta__body">
        <h2>고민 중인 학교, 학점은 인정될까요?</h2>
        <p>내 전공과 파견교 과목을 비교해 인정 가능성을 미리 확인해요</p>
      </div>
      <span class="credits-cta__arrow" aria-hidden="true">→</span>
    </a>
  </div>

  <div class="search-layout">
    <aside class="card filter-panel">
      <div class="section-title" style="margin-bottom:0;">
        <div></div>
        <button class="btn--text filter-reset" id="resetFilters">초기화</button>
      </div>

      <div class="filter-group filter-group--half">
        <span class="filter-group__title">정렬</span>
        <select class="sort-select" id="sortSelect" style="height:36px;">
          <option value="default">기본순</option>
          <option value="major">전공 유사도 순</option>
          <option value="slot">정원 많은 순</option>
        </select>
      </div>
      <div class="filter-group filter-group--half">
        <span class="filter-group__title">QS 순위</span>
        <select class="sort-select" id="qsSelect" style="height:36px;">
          <option value="">전체</option>
          <option value="50">Top 50</option>
          <option value="100">Top 100</option>
          <option value="200">Top 200</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-group__title">학과</span>
        <div class="filter-chip-list" id="majorFilters"></div>
      </div>
      <div class="filter-group filter-group--half">
        <span class="filter-group__title">지원 자격</span>
        <div class="filter-chip-list" id="programFilters"></div>
      </div>
      <div class="filter-group filter-group--half">
        <span class="filter-group__title">수업 언어</span>
        <div class="filter-chip-list" id="trackFilters"></div>
      </div>
      <div class="filter-group">
        <span class="filter-group__title">상권</span>
        <div class="filter-chip-list" id="commerceFilters"></div>
      </div>
      <div class="filter-group">
        <span class="filter-group__title">치안</span>
        <div class="filter-chip-list" id="securityFilters"></div>
      </div>
    </aside>

    <main>
      <div class="result-meta">
        <span class="result-meta__count" id="resultCount"></span>
        <!-- 지원 가능만·즐겨찾기만은 필터 시트 안에 있었다. 가장 자주 켜는 두 개라
             시트를 열지 않고 결과 수 옆에서 바로 켜고 끄게 꺼냈다. -->
        <div class="result-meta__quick">
          <button type="button" class="chip" id="onlyEligibleToggle" aria-pressed="false">지원 가능만</button>
          <button type="button" class="chip" id="onlyFavoriteToggle" aria-pressed="false">즐겨찾기만</button>
        </div>
      </div>
      <div class="school-grid" id="schoolGrid"></div>
      <div class="school-pager" id="schoolPager"></div>
    </main>
  </div>
</div>

<div id="mentor-float"></div>

<script src="js/release-flags.js"></script>
<script src="js/analytics.js"></script>
<script src="js/review-topics.js"></script>
<script src="js/currency-rates.js"></script>
<script src="js/country-flags.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/school-logos.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data-source.js"></script>
<script src="js/state.js"></script>
<script src="js/decimal-input.js"></script>
<script src="js/components/departure.js"></script>
<script src="js/components/layout.js"></script>
<script src="js/ads.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/components/paywall.js"></script>
<script src="js/components/searchable-select.js"></script>
<script src="js/components/eligibility.js"></script>
<script src="js/components/radar-chart.js"></script>
<script src="js/wordmark-text.js"></script>
<script src="js/components/school-modal.js"></script>
<script src="js/components/profile-card.js"></script>
<script src="js/components/progress-ring.js"></script>
<script src="js/components/todo-card.js"></script>
<script src="js/components/prepare-view.js"></script>
<script src="js/components/major-credit.js"></script>
<script src="js/search.js"></script>
<script src="js/app-links.js"></script>
<script src="js/invite.js"></script>
</body>
</html>
