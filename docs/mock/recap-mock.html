<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>steppY Recap 시안</title>
<style>
:root {
  --ink: #1E2A3A; --ink-soft: #566174; --line: #E9ECF1; --storm: #23354D;
  --route: #1A73E8; --pin: #D5352B; --tag: #F6E08E;
  --font: 'Apple SD Gothic Neo', 'AppleGothic', 'Pretendard', -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; background: #E4E8EE; font-family: var(--font); color: var(--ink); }
body { display: flex; justify-content: center; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.phone { position: relative; width: 402px; height: 874px; flex: none; overflow: hidden; background: #fff; }
.screen { position: absolute; inset: 0; visibility: hidden; opacity: 0; transition: opacity .22s; }
.screen.is-on { visibility: visible; opacity: 1; }

/* 기록 첫 화면 */
#home { padding: 72px 24px 24px; }
.home-title { font-size: 45px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.home-sec { margin-top: 24px; font-size: 18px; font-weight: 900; }
.entry { position: relative; display: block; width: 100%; height: 188px; margin-top: 12px; overflow: hidden; border-radius: 18px; background-size: cover; background-position: center; text-align: left; color: #fff; }
.entry::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,18,30,.05) 30%, rgba(10,18,30,.72)); }
.entry b, .entry small { position: absolute; left: 20px; z-index: 1; }
.entry b { bottom: 38px; font-size: 24px; font-weight: 800; }
.entry small { bottom: 18px; font-size: 13px; }
.entry i { position: absolute; z-index: 1; right: 20px; bottom: 18px; font-style: normal; font-size: 18px; }
.home-hint { margin-top: 16px; font-size: 13px; line-height: 1.5; color: var(--ink-soft); }

/* 공통: 사진 위 화면 */
.photo-screen { background-size: cover; background-position: center; color: #fff; }
.photo-screen::before { content: ''; position: absolute; inset: 0; background: rgba(10,16,26,.34); }
.back { position: absolute; z-index: 5; top: 52px; left: 16px; width: 40px; height: 40px; border-radius: 50%; background: rgba(10,16,26,.42); font-size: 18px; color: #fff; }

/* Monthly */
.cal { position: absolute; z-index: 2; left: 16px; right: 16px; top: 190px; }
.cal-head { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; text-align: center; }
.cal-head h2 { font-size: 22px; font-weight: 500; letter-spacing: -.01em; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
.cal-nav { height: 40px; font-size: 18px; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
.cal-nav:disabled { opacity: .3; cursor: default; }
.cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-week { margin-top: 16px; text-align: center; font-size: 12px; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
.cal-grid { margin-top: 12px; border-top: 1px solid rgba(255,255,255,.82); border-left: 1px solid rgba(255,255,255,.82); }
.day { position: relative; display: block; height: 66px; border-right: 1px solid rgba(255,255,255,.82); border-bottom: 1px solid rgba(255,255,255,.82); background-repeat: no-repeat; cursor: default; }
.day[data-photo] { cursor: pointer; }
.day span { position: absolute; top: 4px; left: 5px; font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,.75); }
.cal-sum { margin-top: 16px; text-align: center; font-size: 13px; text-shadow: 0 1px 5px rgba(0,0,0,.65); }

.view { position: absolute; z-index: 8; inset: 0; display: none; place-items: center; padding: 32px; background: rgba(8,12,20,.82); color: #fff; }
.view.is-on { display: grid; }
.view div { width: 100%; }
.view img, .view .shot { display: block; width: 100%; height: 420px; border: 6px solid #fff; border-radius: 6px; background-repeat: no-repeat; }
.view p { margin-top: 12px; text-align: center; font-size: 13px; }

/* Recap */
.search { position: absolute; z-index: 3; left: 64px; right: 16px; top: 52px; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 999px; background: #fff; color: var(--ink); font-size: 13px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
.search svg { flex: none; }
.search b { font-weight: 800; }
.search em { margin-left: auto; font-style: normal; color: var(--ink-soft); }
.route { position: absolute; z-index: 2; inset: 0; width: 402px; height: 874px; pointer-events: none; }
.route path { fill: none; stroke: var(--route); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; }
#recap.is-on .route path { animation: draw 1.1s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.km { position: absolute; z-index: 3; height: 28px; padding: 0 10px; display: flex; align-items: center; border-radius: 4px; background: var(--route); color: #fff; font-size: 13px; font-weight: 700; }
.km::before { content: ''; position: absolute; left: 0; top: -8px; border-left: 2px solid var(--route); border-top: 8px solid transparent; border-right: 7px solid var(--route); width: 0; height: 0; border-right-color: transparent; border-left-color: var(--route); }
.start { position: absolute; z-index: 3; width: 28px; height: 28px; border-radius: 50%; background: var(--route); border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.4); }
.pin { position: absolute; z-index: 3; width: 28px; height: 38px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
.stop { position: absolute; z-index: 4; width: 116px; text-align: center; color: var(--ink); }
.stop-photo { position: relative; display: block; width: 116px; height: 142px; border: 4px solid #fff; border-radius: 5px; background-repeat: no-repeat; box-shadow: 0 3px 10px rgba(0,0,0,.4); }
.stop-n { position: absolute; top: -20px; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; background: var(--route); color: #fff; font-size: 14px; font-weight: 700; }
.stop.n-left .stop-n { left: -20px; }
.stop.n-right .stop-n { right: -20px; }
.stop-name { display: inline-block; margin-top: 6px; padding: 1px 5px; background: var(--tag); font-size: 13px; font-weight: 800; }
.sheet { position: absolute; z-index: 6; left: 16px; right: 16px; bottom: 24px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-align: left; border-radius: 18px; background: #fff; color: var(--ink); box-shadow: 0 4px 18px rgba(0,0,0,.35); }
.sheet-thumb { flex: none; width: 48px; height: 48px; border-radius: 8px; background-repeat: no-repeat; }
.sheet b { display: block; font-size: 16px; font-weight: 800; }
.sheet small { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-soft); }
.sheet span.go { margin-left: auto; font-size: 18px; color: var(--ink-soft); }
@media (prefers-reduced-motion: reduce) { .screen { transition: none; } #recap.is-on .route path { animation: none; } }
</style>
</head>

const crop = (n) => {
  const zoom = 150 + (n * 37) % 70;
  return `background-image:url(${IMG[[0, 2, 1, 0, 2, 4][n % 6]]});background-size:auto ${zoom}%;background-position:${(n * 29) % 100}% ${25 + (n * 43) % 45}%`;
};
const $ = (id) => document.getElementById(id);
const show = (id) => document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('is-on', s.id === id));
$('openMonthly').onclick = () => show('monthly');
$('openRecap').onclick = () => show('recap');
document.querySelectorAll('[data-home]').forEach((b) => { b.onclick = () => show('home'); });

const MONTHS = [
  { y: 2026, m: 8, name: 'September', days: [2,3,5,6,9,12,13,16,19,20,24,27,28] },
  { y: 2026, m: 9, name: 'October', days: [2,3,4,6,8,9,12,13,14,15,17,18,19,21,23,26,27,29] },
  { y: 2026, m: 10, name: 'November', days: [1,3,5,7,8,11,14,15,18,21,22] }
];
let cur = 1;
function renderMonth() {
  const M = MONTHS[cur];
  const lead = (new Date(M.y, M.m, 1).getDay() + 6) % 7;
  const last = new Date(M.y, M.m + 1, 0).getDate();
  const total = Math.ceil((lead + last) / 7) * 7;
  let html = '';
  for (let i = 0; i < total; i++) {
    const d = i - lead + 1;
    if (d < 1 || d > last) { html += '<span class="day"></span>'; continue; }
    const has = M.days.includes(d);
    html += `<span class="day" ${has ? `data-photo="${d + cur * 11}" data-day="${d}" role="button" tabindex="0" aria-label="${M.m + 1}월 ${d}일 사진" style="${crop(d + cur * 11)}"` : ''}><span>${d}</span></span>`;
  }
  $('grid').innerHTML = html;
  $('calTitle').textContent = M.name;
  $('calSum').textContent = `${M.days.length}일의 기록`;
  $('prev').disabled = cur === 0;
  $('next').disabled = cur === MONTHS.length - 1;
}
$('prev').onclick = () => { if (cur > 0) { cur--; renderMonth(); } };
$('next').onclick = () => { if (cur < MONTHS.length - 1) { cur++; renderMonth(); } };
$('grid').onclick = (e) => {
  const d = e.target.closest('[data-photo]');
  if (!d) return;
  $('shot').style.cssText = crop(Number(d.dataset.photo));
  $('shotDate').textContent = `${MONTHS[cur].name} ${d.dataset.day}`;
  $('view').classList.add('is-on');
};
$('view').onclick = () => $('view').classList.remove('is-on');
renderMonth();

const STOPS = [
  { name: 'Madrid', n: 28, date: '2026.08.30 ~ 09.18', x: 24, y: 226, side: 'left', img: 2 },
  { name: 'Lisbon', n: 34, date: '2026.09.19 ~ 09.22', x: 262, y: 246, side: 'right', img: 8 },
  { name: 'Paris', n: 15, date: '2026.10.09 ~ 10.13', x: 70, y: 490, side: 'left', img: 14 },
  { name: 'Prague', n: 11, date: '2026.11.05 ~ 11.08', x: 238, y: 600, side: 'right', img: 21 }
];
$('stops').innerHTML = STOPS.map((s, i) => `
  <button class="stop n-${s.side}" data-stop="${i}" style="left:${s.x}px;top:${s.y}px" aria-label="${s.name} 사진 ${s.n}장">
    <span class="stop-photo" style="${crop(s.img)}"><span class="stop-n">${s.n}</span></span>
    <span class="stop-name">${s.name}</span>
  </button>`).join('');
function pick(i) {
  const s = STOPS[i];
  $('sheetThumb').style.cssText = crop(s.img);
  $('sheetName').textContent = s.name;
  $('sheetMeta').textContent = `${s.date} · 사진 ${s.n}장`;
}
$('stops').onclick = (e) => { const b = e.target.closest('[data-stop]'); if (b) pick(Number(b.dataset.stop)); };
pick(3);
const fit = () => { $('phone').style.zoom = Math.min(innerWidth / 402, 1); };
addEventListener('resize', fit); fit();
</script>
