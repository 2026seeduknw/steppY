<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기록 — steppY</title>
<link rel="icon" href="assets/logo-mark-circle.png" type="image/png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/diary.css">
</head>
<body data-page="diary">

<div id="app-nav" class="app-nav"></div>

<header class="diary-header">
  <div class="page-shell">
    <div class="diary-header__top">
      <h1 class="diary-header__title">기록</h1>
      <div class="diary-streak" id="streakBadge">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2c1 3-3 4-3 7.5A3.5 3.5 0 0 0 12 13a3.5 3.5 0 0 0 3-5c1.5 1.5 2 3.3 2 5a5 5 0 0 1-10 0c0-4 3-5.5 3-9 0-.7.5-1.3 2-2z"/>
        </svg>
        <span class="diary-streak__num" id="streakNum">0</span>
        <span class="diary-streak__label">일 연속</span>
      </div>
    </div>
  </div>
</header>

<span id="progressLabel" hidden></span>
<div id="progressFill" hidden></div>

<div class="page-shell">
  <div class="diary-hero" id="diaryHero">
    <div class="diary-hero__top">
      <span class="diary-hero__eyebrow">MY JOURNEY</span>
      <span class="diary-hero__daycount" id="heroDay">Day 1</span>
    </div>
    <div class="diary-hero__track">
      <span class="diary-hero__pin diary-hero__pin--start" aria-hidden="true"></span>
      <div class="diary-hero__line">
        <div class="diary-hero__fill" id="heroFill"></div>
        <div class="diary-hero__plane" id="heroPlane" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/></svg>
        </div>
      </div>
      <span class="diary-hero__pin diary-hero__pin--end" aria-hidden="true">🏁</span>
    </div>
    <div class="diary-hero__dates">
      <span id="heroStartDate"></span>
      <span id="heroSub">기록을 시작해보세요</span>
      <span id="heroEndDate"></span>
    </div>
  </div>
</div>

<div class="page-shell diary-grid">
  <section class="diary-cal-section">
    <div class="diary-cal-nav">
      <h2 class="diary-cal-nav__title" id="calTitle"></h2>
      <div class="diary-cal-nav__btns">
        <button type="button" class="diary-icon-btn" id="openWrapup" aria-label="이번 달 정리" title="이번 달 정리">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
        </button>
        <button type="button" class="diary-icon-btn" id="openReport" aria-label="경험보고서 미리보기" title="경험보고서 미리보기">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5M9 13h6M9 17h6"/></svg>
        </button>
        <span class="diary-cal-nav__divider"></span>
        <button id="calPrev" aria-label="이전 달" title="이전 달">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button id="calNext" aria-label="다음 달" title="다음 달">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>
    <div class="diary-weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="diary-month" id="calMonth"></div>
  </section>

  <aside class="diary-side">
    <h2 id="sideDate"></h2>
    <div class="diary-entry-list" id="entryList"></div>
  </aside>
</div>

<div class="diary-fab-scrim" aria-hidden="true"></div>
<div class="diary-fab-bar">
  <button type="button" class="diary-fab diary-fab--edit" id="fabEdit" aria-label="찍어둔 사진으로 기록하기" title="찍어둔 사진으로 기록하기">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  </button>
  <label class="diary-fab diary-fab--camera" id="fabCameraLabel" tabindex="0" role="button" aria-label="바로 사진 찍기" title="바로 사진 찍기">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/></svg>
    <input type="file" accept="image/*" capture="environment" id="fabCameraInput" tabindex="-1" style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;">
  </label>
  <button type="button" class="diary-fab diary-fab--quest" id="fabQuest" aria-label="오늘의 퀘스트" title="오늘의 퀘스트">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    <span class="diary-fab--quest__dot" id="questDot" hidden></span>
  </button>
</div>

<script src="js/mock-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data-source.js"></script>
<script src="js/state.js"></script>
<script src="js/components/layout.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/components/auth.js"></script>
<script src="js/song.js"></script>
<script src="js/diary.js"></script>
</body>
</html>
