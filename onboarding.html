<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>시작하기 — steppY</title>
<link rel="icon" href="assets/logo-mark-circle.png" type="image/png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-page="onboarding">

<header class="ob__bar">
  <span class="ob__brand">steppY</span>
  <button type="button" class="ob__skip" id="obSkip">나중에</button>
</header>

<main class="ob">
  <div class="ob__head">
    <h1 class="ob__title">시작 전에 몇 가지만 알려주세요</h1>
    <p class="ob__desc">지원 가능한 학교와 준비 일정을 여기에 맞춰 보여드려요. 나중에 언제든 고칠 수 있어요.</p>
  </div>

  <div class="ob__form">
    <section class="ob__group">
      <h2 class="ob__label">이름 <span class="ob__req">필수</span></h2>
      <input type="text" id="obName" maxlength="20" autocomplete="nickname"
             placeholder="예: 김스텝" aria-label="이름">
      <p class="ob__hint">홈에서 “안녕하세요, ○○님”으로 불러드려요. 별명이어도 괜찮아요.</p>
    </section>

    <section class="ob__group">
      <h2 class="ob__label">학과 <span class="ob__req">필수</span></h2>
      <div id="obMajorMount"></div>
    </section>

    <section class="ob__group">
      <h2 class="ob__label">학점 <span class="ob__req">필수</span></h2>
      <div class="ob__row">
        <input type="number" inputmode="decimal" step="0.01" min="0" id="obGpa" placeholder="예: 3.62" aria-label="학점">
        <select id="obScale" aria-label="학점 기준"></select>
      </div>
    </section>

    <section class="ob__group">
      <h2 class="ob__label">어학 성적</h2>
      <div class="ob__chips" id="obLangChips"></div>
      <div class="ob__row ob__row--score" id="obScoreRow">
        <input type="number" inputmode="numeric" id="obLangScore" placeholder="점수 (예: 96)" aria-label="어학 점수">
      </div>
    </section>

    <section class="ob__group">
      <h2 class="ob__label">교환 시기</h2>
      <div class="ob__row">
        <select id="obYear" aria-label="연도"></select>
      </div>
      <div class="ob__chips" id="obSeasons"></div>
    </section>
  </div>

  <p class="ob__error" id="obError" role="alert" hidden></p>
</main>

<footer class="ob__footer">
  <button type="button" class="btn btn--primary btn--block" id="obNext">시작하기</button>
</footer>

<script src="js/release-flags.js"></script>
<script src="js/analytics.js"></script>
<script src="js/review-topics.js"></script>
<script src="js/currency-rates.js"></script>
<script src="js/country-flags.js"></script>
<script src="js/mock-data.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data-source.js"></script>
<script src="js/state.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/components/searchable-select.js"></script>
<script src="js/onboarding.js"></script>
</body>
</html>
