<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>시작하기 — steppY</title>
<link rel="icon" href="assets/logo-mark-circle.png" type="image/png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-page="onboarding">

<header class="ob__bar">
  <button type="button" class="ob__back" id="obBack" aria-label="이전 단계">‹</button>
  <div class="ob__progress" id="obProgress" role="progressbar" aria-valuemin="1" aria-valuemax="4"></div>
  <button type="button" class="ob__skip" id="obSkip">나중에</button>
</header>

<main class="ob">
  <div class="ob__head">
    <p class="ob__step" id="obStepLabel"></p>
    <h1 class="ob__title" id="obTitle"></h1>
    <p class="ob__desc" id="obDesc"></p>
  </div>

  <div class="ob__body" id="obBody"></div>

  <p class="ob__error" id="obError" role="alert" hidden></p>
</main>

<footer class="ob__footer">
  <button type="button" class="btn btn--primary btn--block" id="obNext">다음</button>
</footer>

<script src="js/analytics.js"></script>
<script src="js/review-topics.js"></script>
<script src="js/currency-rates.js"></script>
<script src="js/country-flags.js"></script>
<script src="js/mock-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data-source.js"></script>
<script src="js/state.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/components/searchable-select.js"></script>
<script src="js/onboarding.js"></script>
</body>
</html>
