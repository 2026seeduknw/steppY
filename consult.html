<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>멘토 없는 멘토 상담 — steppY</title>
<link rel="icon" href="assets/logo-mark-circle.png" type="image/png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/consult.css">
</head>
<body data-page="consult">

<div id="app-nav" class="app-nav"></div>

<div class="page-shell home-hero">
  
  <h1>Mentor's Step <span class="help-badge" title="선배들의 교환학생 경험보고서 후기를 키워드로 매칭해 보여주는 데모예요. 실제 AI 답변이 아니라, 미리 준비된 후기 중 질문과 관련 있는 내용을 찾아드려요.">?</span></h1>
</div>

<div class="page-shell consult-layout">
  <section class="card card-pad">
    <div class="section-title" style="margin-bottom:0;"><div><h2>학교를 검색해서 선택하세요</h2></div></div>
    <div id="schoolPicker"></div>
  </section>

  <section class="card card-pad chat-panel" id="chatPanel" hidden>
    <div class="section-title"><div><h2 id="chatSchoolName">선배 후기 챗봇</h2></div></div>
    <div class="chat-messages" id="chatMessages"></div>
    <form class="chat-input-row" id="chatForm">
      <input type="text" id="chatInput" placeholder="궁금한 점을 자유롭게 물어보세요 (예: 기숙사 어때?)" autocomplete="off">
      <button type="submit" class="chat-send-btn" aria-label="전송">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3.5 12L20.5 4L13 20.5L11 13L3.5 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </button>
    </form>
  </section>
</div>

<div id="mentor-float"></div>

<script src="js/analytics.js"></script>
<script src="js/review-topics.js"></script>
<script src="js/currency-rates.js"></script>
<script src="js/country-flags.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/school-logos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data-source.js"></script>
<script src="js/state.js"></script>
<script src="js/components/layout.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/components/searchable-select.js"></script>
<script src="js/consult.js"></script>
</body>
</html>
