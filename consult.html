<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mentor's Step — steppY</title>
<link rel="icon" href="assets/logo-mark-circle.png" type="image/png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">

<body data-page="consult">

<div id="app-nav" class="app-nav"></div>

<div class="page-shell home-hero">
  <h1><span class="wm-text">Mentor's Step !</span></h1>
  <p class="page-lede" id="mentorLede">교환 준비하며 궁금한 걸 남기면 다녀온 선배가 답해줘요. 질문·답변 모두 이름 없이 올라가요.</p>
</div>

<div class="page-shell mentor-layout" id="mentorQaPanel">
  <div class="mentor-toolbar">
    <div class="mentor-credit" id="mentorCredit" hidden>
      <span aria-hidden="true">🪙</span><strong id="mentorCreditNum">0</strong>
    </div>
    <button type="button" class="btn btn--accent" id="askOpenBtn">질문하기</button>
  </div>

  <div class="mentor-filters">
    <div class="country-filter" id="mentorCountryFilter" role="group" aria-label="국가 필터"></div>
    <div class="toggle-row toggle-row--tight">
      <span>즐겨찾기만</span>
      <button type="button" class="toggle-switch" id="mentorFavToggle"></button>
    </div>
  </div>

  <div class="mentor-list" id="mentorList"></div>
</div>

<div id="mentor-float"></div>

<script src="js/release-flags.js"></script>
<script src="js/analytics.js"></script>
