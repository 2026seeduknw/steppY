<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Talky · steppY</title>
<link rel="icon" href="assets/logo-mark-circle.png" type="image/png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/consult.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/v2.css">
</head>
<body data-page="consult">

<div id="app-nav" class="app-nav"></div>

<div class="page-shell">
  <header class="v2-head m2-head">
    <p class="v2-head__eyebrow">Share your step!</p>
    <h1 class="v2-head__title">Talky</h1>
  </header>
  <p class="m2-lede" id="mentorLede" hidden></p>
</div>

<div class="page-shell mentor-layout m2" id="mentorQaPanel">
  <!-- 질문 입력줄 — 학교 찾기의 검색칸 + 버튼과 같은 꼴. 누르면 질문 쓰기 시트가 열린다 -->
  <div class="m2-ask">
    <button type="button" class="m2-ask__in" id="askOpenField">다녀온 선배에게 궁금한 걸 물어보세요</button>
    <button type="button" class="m2-ask__btn" id="askOpenBtn">✎ 질문</button>
    <button type="button" class="mentor-credit" id="mentorCredit" hidden><span aria-hidden="true">🪙</span><strong id="mentorCreditNum">0</strong></button>
  </div>

  <div class="m2-chips">
    <div class="m2-chips__scroll" id="mentorCountryFilter" role="group" aria-label="국가 필터"></div>
    <button type="button" class="chip m2-fav" id="mentorFavToggle" aria-pressed="false">★ 즐겨찾기</button>
  </div>

  <div class="mentor-pins" id="mentorPins" hidden></div>

  <div class="m2-sec"><h2>질문 · 답변</h2><span id="mentorListNote">최신순</span></div>
  <div class="mentor-list" id="mentorList"></div>
</div>

<div id="mentor-float"></div>

<script src="js/release-flags.js"></script>
<script src="js/analytics.js"></script>
<script src="js/review-topics.js"></script>
<script src="js/currency-rates.js"></script>
<script src="js/country-flags.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/school-logos.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/data-source.js"></script>
<script src="js/state.js"></script>
<script src="js/oia-rules.js"></script>
<script src="js/decimal-input.js"></script>
<script src="js/components/departure.js"></script>
<script src="js/components/layout.js"></script>
<script src="js/components/dropdown.js"></script>
<script src="js/ads.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/components/paywall.js"></script>
<script src="js/components/searchable-select.js"></script>
<script src="js/components/profile-card.js"></script>
<script src="js/consult.js"></script>
<script src="js/app-links.js"></script>
<script src="js/invite.js"></script>
</body>
</html>
